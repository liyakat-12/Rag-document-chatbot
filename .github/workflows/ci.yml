name: Python CI

on:
  push:
    branches:
      - main
      - feature/advanced-rag-retrieval
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LLM_PROVIDER: extractive
      EMBEDDING_PROVIDER: local
      SEMANTIC_CACHE_ENABLED: "false"
      DATABASE_URL: sqlite+aiosqlite:///./ci-test.db
      OPENAI_API_KEY: test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install test dependencies (skip optional cross-encoder weights package)
        run: |
          python -m pip install --upgrade pip
          grep -v '^sentence-transformers' requirements.txt > /tmp/requirements-ci.txt
          pip install -r /tmp/requirements-ci.txt
      - name: Compile Python
        run: python -m compileall -q backend tests
      - name: Run test suite
        run: pytest -q
