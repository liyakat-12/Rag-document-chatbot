[server]
maxUploadSize = 40
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Navy + teal light baseline. Dark mode is applied at runtime via styles/theme.py.
[theme]
primaryColor = "#0F766E"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172B4D"
font = "sans serif"
