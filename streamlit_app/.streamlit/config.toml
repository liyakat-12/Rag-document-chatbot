[server]
maxUploadSize = 40
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
# Aligned with DocuMind AI light theme (custom CSS still applies on top)
primaryColor = "#1f6b5c"
backgroundColor = "#f6f7f9"
secondaryBackgroundColor = "#ffffff"
textColor = "#1a2332"
font = "sans serif"
